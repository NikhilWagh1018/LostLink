<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recover — Console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef6f4;
  --panel: #ffffff;
  --panel-raised: #ffffff;
  --line: rgba(15,110,86,.14);
  --text: #0b2620;
  --text-dim: #6f8f86;
  --accent: #0f6e56;
  --accent-soft: #d9f0ea;
  --ok: #1d9e75;
  --warn: #c98a1f;
  --danger: #c0432c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
.mono { font-family: 'IBM Plex Mono', monospace; }
#gate { height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 28px; background: var(--bg); }
#gate .mark { font-size: 15px; letter-spacing: 0.14em; color: var(--accent); }
#gate .mark::before { content: "\25CF"; margin-right: 8px; font-size: 9px; vertical-align: middle; }
#gate form { width: 300px; display: flex; flex-direction: column; gap: 14px; }
#gate input { background: #ffffff; border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding: 10px 12px; outline: none; }
#gate input:focus { border-color: var(--accent); }
#gate button { margin-top: 8px; background: var(--accent); color: #ffffff; border: none; padding: 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 10px; }
#gate button:hover { background: #0c5c48; }
#gate-error { color: var(--danger); font-size: 13px; font-family: 'IBM Plex Mono', monospace; min-height: 16px; }
#console { display: none; height: 100%; }
#console.active { display: grid; grid-template-columns: 1fr 360px; }
#map { height: 100%; background: #dfeee9; }
#sidebar { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#sidebar header { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
#sidebar header .title-block { display: flex; flex-direction: column; gap: 4px; }
#sidebar header .title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; color: var(--text); }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(29,158,117,0.4); } 70% { box-shadow: 0 0 0 6px rgba(29,158,117,0); } 100% { box-shadow: 0 0 0 0 rgba(29,158,117,0); } }
#sidebar header .subtitle { font-size: 11px; color: var(--text-dim); font-family: 'Inter', sans-serif; padding-left: 16px; }
#logout { background: none; border: 1px solid var(--line); color: var(--text-dim); font-size: 12px; padding: 6px 10px; cursor: pointer; font-family: 'Inter', sans-serif; border-radius: 8px; }
#logout:hover { color: var(--text); border-color: var(--accent); }
#status-block { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.stat-tile { background: var(--panel-raised); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 1px 3px rgba(15,110,86,.05); }
.tile-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.tile-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 17px; flex-shrink: 0; }
.stat-tile .label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.stat-tile .value { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; color: var(--text); }
#last-seen, #my-distance { font-family: 'Inter', sans-serif; }
.stat-tile .value.live { color: var(--ok); }
.stat-tile .value.warn { color: var(--warn); }
.stat-tile .value.stale { color: var(--text-dim); font-size: 15px; font-weight: 500; }
.stat-row { display: flex; gap: 10px; }
.stat-row .stat-tile { flex: 1; }
#distance-tile .value { font-size: 20px; color: var(--text); font-weight: 600; }
#coords-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#copy-coords-btn { background: var(--accent-soft); border: none; color: var(--accent); font-size: 11px; padding: 7px 12px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; border-radius: 10px; white-space: nowrap; }
#copy-coords-btn:hover { background: #c7e7dd; }
#copy-coords-btn.copied { color: #ffffff; background: var(--ok); }
#directions-btn { display: none; background: var(--accent); color: #ffffff; text-align: center; text-decoration: none; padding: 12px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; border-radius: 14px; }
#recenter-btn { display: none; position: fixed; top: 16px; right: 16px; z-index: 1000; width: 44px; height: 44px; border-radius: 50%; background: #ffffff; border: 1px solid var(--line); color: var(--accent); box-shadow: 0 4px 14px rgba(15,110,86,.2); align-items: center; justify-content: center; cursor: pointer; }
#recenter-btn:active { background: var(--accent-soft); }
#directions-btn:hover { background: #0c5c48; }
#session-select { width: 100%; background: #ffffff; color: var(--text); border: 1px solid var(--line); padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; border-radius: 10px; }
#photo-feed { padding: 16px 20px; }
#photo-feed .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
.photo-card { margin-bottom: 16px; background: var(--panel-raised); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.photo-card img { width: 100%; display: block; }
.photo-card .ts { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); padding: 8px 10px; }
.empty-note { color: var(--text-dim); font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
@media (max-width: 768px) {
  #gate form { width: 90%; max-width: 320px; }
  #console.active { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  #map { height: 55vh; }
  #sidebar {
    border-left: none;
    border-top: 1px solid var(--line);
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
  }
  #sidebar header { padding: calc(14px + env(safe-area-inset-top)) 16px 14px; }
  #status-block { padding: 14px 16px; gap: 12px; }
  #photo-feed { padding: 14px 16px; }
  .stat-tile { padding: 10px 12px; }
  #logout { padding: 10px 14px; font-size: 12px; min-height: 40px; }
  #coords-row { flex-wrap: wrap; row-gap: 10px; }
  #copy-coords-btn { padding: 9px 14px; font-size: 12px; min-height: 40px; flex-shrink: 0; }
  #session-select { padding: 13px 12px; font-size: 13px; min-height: 46px; }
  #directions-btn {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom));
    z-index: 1000;
    padding: 15px;
    font-size: 15px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(15,110,86,.28);
  }
  #recenter-btn.has-target {
    display: flex;
    top: calc(16px + env(safe-area-inset-top));
    right: 16px;
  }
  #photo-list {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
    scroll-snap-type: x proximity;
  }
  .photo-card {
    margin-bottom: 0;
    flex: 0 0 140px;
    scroll-snap-align: start;
  }
  .photo-card img { height: 140px; object-fit: cover; }
  .photo-card .ts { font-size: 10px; padding: 6px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
}
</style>
</head>
<body>
<div id="gate">
  <div class="mark">RECOVER — SIGN IN</div>
  <form id="login-form">
    <input type="email" id="email" placeholder="email" autocomplete="username" required>
    <input type="password" id="password" placeholder="password" autocomplete="current-password" required>
    <button type="submit">Enter console</button>
  </form>
  <div id="gate-error" class="mono"></div>
</div>
<div id="console">
  <div id="map"></div>
  <button id="recenter-btn" type="button" aria-label="Recenter map on last known location">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
  </button>
  <div id="sidebar">
    <header>
      <div class="title-block">
        <div class="title"><span class="live-dot"></span>Recover console</div>
        <div class="subtitle">connected</div>
      </div>
      <button id="logout">Sign out</button>
    </header>
    <div id="status-block">
      <div class="stat-tile">
        <div class="tile-head">
          <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 15"></polyline></svg></span>
          <div class="label">Last report</div>
        </div>
        <div class="value stale mono" id="last-seen">No data yet</div>
      </div>
      <div class="stat-tile">
        <div id="coords-row">
          <div>
            <div class="label">Coordinates</div>
            <div class="value mono" id="last-coords" style="font-size: 13px;">—</div>
          </div>
          <button id="copy-coords-btn" type="button">Copy</button>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-tile" id="distance-tile">
          <div class="tile-head">
            <span class="tile-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></span>
            <div class="label">Distance</div>
          </div>
          <div class="value mono" id="my-distance">—</div>
        </div>
      </div>
      <a id="directions-btn" href="#" target="_blank" rel="noopener">Get Directions →</a>
      <select id="session-select">
        <option value="">All sessions</option>
      </select>
    </div>
    <div id="photo-feed">
      <div class="label">Captured photos</div>
      <div id="photo-list"><div class="empty-note">No photos received yet.</div></div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
(function () {
  "use strict";
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const gate = document.getElementById("gate");
  const consoleEl = document.getElementById("console");
  const loginForm = document.getElementById("login-form");
  const gateError = document.getElementById("gate-error");
  const logoutBtn = document.getElementById("logout");
  const sessionSelect = document.getElementById("session-select");
  const lastSeenEl = document.getElementById("last-seen");
  const lastCoordsEl = document.getElementById("last-coords");
  const photoListEl = document.getElementById("photo-list");
  const directionsBtn = document.getElementById("directions-btn");
  const myDistanceEl = document.getElementById("my-distance");
  const copyCoordsBtn = document.getElementById("copy-coords-btn");
  const recenterBtn = document.getElementById("recenter-btn");
  let map, trailLine, currentMarker;
  let unsubLocations = null;
  let unsubPhotos = null;
  const knownSessions = new Set();
  let myLat = null, myLng = null;
  let lastCapturedAt = null;
  let lastLat = null, lastLng = null;
  let relativeTimeInterval = null;
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    gateError.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (err) {
      gateError.textContent = err.message;
    }
  });
  logoutBtn.addEventListener("click", () => auth.signOut());
  copyCoordsBtn.addEventListener("click", async () => {
    if (lastLat === null || lastLng === null) return;
    try {
      await navigator.clipboard.writeText(`${lastLat}, ${lastLng}`);
      copyCoordsBtn.textContent = "Copied";
      copyCoordsBtn.classList.add("copied");
      setTimeout(() => {
        copyCoordsBtn.textContent = "Copy";
        copyCoordsBtn.classList.remove("copied");
      }, 1500);
    } catch (err) {
      console.warn("Clipboard write failed:", err.message);
    }
  });
  recenterBtn.addEventListener("click", () => {
    if (lastLat === null || lastLng === null || !map) return;
    map.flyTo([lastLat, lastLng], Math.max(map.getZoom(), 16), { duration: 0.6 });
  });
  auth.onAuthStateChanged((user) => {
    if (user && !user.isAnonymous) {
      gate.style.display = "none";
      consoleEl.classList.add("active");
      initConsole();
    } else {
      consoleEl.classList.remove("active");
      gate.style.display = "flex";
      teardownConsole();
    }
  });
  function initConsole() {
    if (!map) {
      map = L.map("map", { zoomControl: true }).setView([20, 0], 3);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19
      }).addTo(map);
      trailLine = L.polyline([], { color: "#0f6e56", weight: 3 }).addTo(map);
    }
    startMyLocationWatch();
    subscribeLocations();
    subscribePhotos();
    if (!relativeTimeInterval) {
      relativeTimeInterval = setInterval(updateRelativeTime, 15000);
    }
  }
  function teardownConsole() {
    if (unsubLocations) unsubLocations();
    if (unsubPhotos) unsubPhotos();
    if (relativeTimeInterval) {
      clearInterval(relativeTimeInterval);
      relativeTimeInterval = null;
    }
  }
  function startMyLocationWatch() {
    if (!navigator.geolocation) return;
    navigator.geolocation.watchPosition(
      (pos) => {
        myLat = pos.coords.latitude;
        myLng = pos.coords.longitude;
      },
      (err) => console.warn("Own location unavailable:", err.message),
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
  }
  function haversineMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = (d) => (d * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a =
      Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  function bearingCompass(lat1, lng1, lat2, lng2) {
    const toRad = (d) => (d * Math.PI) / 180;
    const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
    const x =
      Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
      Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
    const deg = ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
    const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
    return dirs[Math.round(deg / 45) % 8];
  }
  function formatRelativeTime(ageMs) {
    const seconds = Math.floor(ageMs / 1000);
    if (seconds < 60) return "just now";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes} min ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }
  function updateRelativeTime() {
    if (!lastCapturedAt) return;
    const ageMs = Date.now() - lastCapturedAt.getTime();
    lastSeenEl.textContent = formatRelativeTime(ageMs);
    if (ageMs < 2 * 60 * 1000) {
      lastSeenEl.className = "value live mono";
    } else if (ageMs < 15 * 60 * 1000) {
      lastSeenEl.className = "value warn mono";
    } else {
      lastSeenEl.className = "value stale mono";
    }
  }
  function subscribeLocations() {
    const sessionFilter = sessionSelect.value;
    if (unsubLocations) unsubLocations();
    let query = db.collection("locations").orderBy("capturedAt", "asc").limitToLast(500);
    if (sessionFilter) query = query.where("sessionId", "==", sessionFilter);
    unsubLocations = query.onSnapshot((snap) => {
      const points = [];
      snap.forEach((doc) => {
        const d = doc.data();
        knownSessions.add(d.sessionId);
        if (typeof d.lat === "number" && typeof d.lng === "number") {
          points.push({ latlng: [d.lat, d.lng], data: d });
        }
      });
      refreshSessionOptions();
      if (points.length === 0) {
        lastSeenEl.textContent = "No data yet";
        lastSeenEl.className = "value stale mono";
        lastCoordsEl.textContent = "—";
        myDistanceEl.textContent = "—";
        directionsBtn.style.display = "none";
        recenterBtn.classList.remove("has-target");
        lastCapturedAt = null;
        lastLat = null;
        lastLng = null;
        return;
      }
      const latlngs = points.map((p) => p.latlng);
      trailLine.setLatLngs(latlngs);
      const latest = points[points.length - 1];
      if (currentMarker) map.removeLayer(currentMarker);
      currentMarker = L.circleMarker(latest.latlng, {
        radius: 8,
        color: "#0f6e56",
        fillColor: "#0f6e56",
        fillOpacity: 0.9
      }).addTo(map);
      map.fitBounds(trailLine.getBounds(), { padding: [40, 40], maxZoom: 17 });
      lastCapturedAt = latest.data.capturedAt?.toDate ? latest.data.capturedAt.toDate() : new Date();
      lastLat = latest.data.lat;
      lastLng = latest.data.lng;
      updateRelativeTime();
      lastCoordsEl.textContent =
        `${latest.data.lat.toFixed(6)}, ${latest.data.lng.toFixed(6)}` +
        (latest.data.accuracy ? ` ±${Math.round(latest.data.accuracy)}m` : "");
      directionsBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${latest.data.lat},${latest.data.lng}&travelmode=driving`;
      directionsBtn.style.display = "block";
      recenterBtn.classList.add("has-target");
      if (myLat !== null && myLng !== null) {
        const dist = haversineMeters(myLat, myLng, latest.data.lat, latest.data.lng);
        const dir = bearingCompass(myLat, myLng, latest.data.lat, latest.data.lng);
        if (dist < 5) {
          myDistanceEl.textContent = "You are here";
        } else {
          const distText = dist < 1000 ? `${Math.round(dist)}m` : `${(dist / 1000).toFixed(1)}km`;
          myDistanceEl.textContent = `${distText} ${dir} from you`;
        }
      } else {
        myDistanceEl.textContent = "—";
      }
    }, (err) => {
      console.error(err);
    });
  }
  function subscribePhotos() {
    const sessionFilter = sessionSelect.value;
    if (unsubPhotos) unsubPhotos();
    let query = db.collection("photos").orderBy("capturedAt", "desc").limit(20);
    if (sessionFilter) query = query.where("sessionId", "==", sessionFilter);
    unsubPhotos = query.onSnapshot((snap) => {
      if (snap.empty) {
        photoListEl.innerHTML = '<div class="empty-note">No photos received yet.</div>';
        return;
      }
      photoListEl.innerHTML = "";
      snap.forEach((doc) => {
        const d = doc.data();
        const capturedAt = d.capturedAt?.toDate ? d.capturedAt.toDate() : null;
        const card = document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `
          <img src="${d.dataUrl}" alt="capture">
          <div class="ts">${capturedAt ? capturedAt.toLocaleString() : "pending timestamp"}</div>
        `;
        photoListEl.appendChild(card);
      });
    }, (err) => {
      console.error(err);
    });
  }
  function refreshSessionOptions() {
    const existing = new Set(Array.from(sessionSelect.options).map((o) => o.value));
    knownSessions.forEach((sid) => {
      if (!existing.has(sid)) {
        const opt = document.createElement("option");
        opt.value = sid;
        const icon = sid.startsWith("native-") ? "\uD83D\uDCF1" : "\uD83C\uDF10";
        opt.textContent = `${icon} ${sid}`;
        sessionSelect.appendChild(opt);
      }
    });
  }
  sessionSelect.addEventListener("change", () => {
    subscribeLocations();
    subscribePhotos();
  });
})();
</script>
</body>
</html>
