<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>·</title>
<!--
  This page is opened silently by the Samsung Routine's "Open Link" action.
  It has no visible UI by design — anything drawn on screen risks tipping
  off whoever is holding the phone. It:
    1. Signs in anonymously to Firebase (silent, no popup, no login screen)
    2. Starts watching GPS position and writes each point to Firestore
    3. Grabs one front-camera frame and uploads it to Firebase Storage
    4. Stops itself automatically after REPORTING_DURATION_MINUTES

  IMPORTANT — first-run permission grant:
  Browsers require a user gesture / prior grant before geolocation and
  camera work without prompting. Before relying on this in an emergency,
  open this exact hosted URL ONCE on your own phone and manually accept
  the location + camera permission prompts (see Phase 4 in the README).
  After that, the permissions are remembered and future silent opens
  (e.g. via the Routine) will not show a prompt.
-->
<style>
  /* Intentionally blank page — no visible styling, no visible content.
     A totally blank white/black page is itself a small tell if someone
     glances at the screen, so we render the ordinary system default
     background and nothing else. */
  html, body { margin: 0; padding: 0; background: #fff; }
</style>
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
(async function stealth() {
  "use strict";

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const storage = firebase.storage();

  const sessionId = "session-" + Date.now();
  const stopAtMs = Date.now() + REPORTING_DURATION_MINUTES * 60 * 1000;
  let watchId = null;
  let photoTaken = false;

  function log() {
    // No-op in production. Flip to console.log for local testing only —
    // remote debugging tools can surface console output, which defeats
    // the point of Stealth Mode.
  }

  async function ensureSignedIn() {
    if (auth.currentUser) return auth.currentUser;
    const cred = await auth.signInAnonymously();
    return cred.user;
  }

  function writeLocationPoint(user, position) {
    const { latitude, longitude, accuracy, altitude, speed, heading } = position.coords;
    return db.collection("locations").add({
      uid: user.uid,
      sessionId,
      lat: latitude,
      lng: longitude,
      accuracy: accuracy ?? null,
      altitude: altitude ?? null,
      speed: speed ?? null,
      heading: heading ?? null,
      capturedAt: firebase.firestore.FieldValue.serverTimestamp(),
      clientTimestamp: position.timestamp
    });
  }

  function startLocationWatch(user) {
    if (!("geolocation" in navigator)) return;

    let lastWriteMs = 0;
    watchId = navigator.geolocation.watchPosition(
      (position) => {
        const now = Date.now();
        if (now - lastWriteMs < LOCATION_WRITE_INTERVAL_SECONDS * 1000) return;
        lastWriteMs = now;
        writeLocationPoint(user, position).catch(log);
      },
      (err) => log("geolocation error", err),
      {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 20000
      }
    );
  }

  async function capturePhoto(user) {
    if (photoTaken) return;
    if (!("mediaDevices" in navigator) || !navigator.mediaDevices.getUserMedia) return;

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: false
      });
    } catch (err) {
      log("camera error", err);
      return;
    }

    photoTaken = true;

    const video = document.createElement("video");
    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    await video.play().catch(() => {});

    // Give the sensor a moment to adjust exposure before grabbing a frame.
    await new Promise((resolve) => setTimeout(resolve, 800));

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    stream.getTracks().forEach((track) => track.stop());

    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const path = `captures/${user.uid}/${sessionId}.jpg`;
      const ref = storage.ref(path);
      try {
        await ref.put(blob, { contentType: "image/jpeg" });
        const url = await ref.getDownloadURL();
        await db.collection("photos").add({
          uid: user.uid,
          sessionId,
          storagePath: path,
          url,
          capturedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        log("upload error", err);
      }
    }, "image/jpeg", 0.85);
  }

  function scheduleAutoStop() {
    const remaining = stopAtMs - Date.now();
    setTimeout(() => {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    }, Math.max(remaining, 0));
  }

  try {
    const user = await ensureSignedIn();
    startLocationWatch(user);
    capturePhoto(user);
    scheduleAutoStop();
  } catch (err) {
    log("stealth init failed", err);
  }
})();
</script>

</body>
</html>
